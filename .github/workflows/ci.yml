name: CI

on:
  push:
  pull_request:

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build --preset linux-gcc
      - name: Test
        run: ctest --preset linux-gcc

  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure
        run: cmake --preset linux-clang
      - name: Build
        run: cmake --build --preset linux-clang
      - name: Test
        run: ctest --preset linux-clang
      - name: Test (clang++ as the generated-code backend, not just ebc's own build compiler)
        # These are two independent choices - which compiler builds ebc
        # itself (set by the linux-clang preset above) vs. which compiler
        # ebc invokes to compile *generated* C++ (ebc's own -cxx/CXX,
        # otherwise defaulting to plain g++ regardless of how ebc itself
        # was built) - until now nothing in CI exercised the second choice
        # with clang++ at all. ebpm needs no flag of its own: it inherits
        # CXX from the environment when it shells out to ebc.
        run: CXX=clang++ ctest --preset linux-clang

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset macos
      - name: Build
        run: cmake --build --preset macos
      - name: Test
        run: ctest --preset macos

  windows-mingw:
    # M8b/M8c: MinGW port - run inside an MSYS2 (mingw64) shell rather than
    # a native cmd/PowerShell prompt, matching how the "windows-mingw"
    # CMake preset itself is designed (Unix Makefiles, plain g++/gcc). See
    # the windows-msvc job below for the MSVC alternative.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
      - name: Configure
        run: cmake --preset windows-mingw
      - name: Build
        run: cmake --build --preset windows-mingw
      - name: Test
        run: ctest --preset windows-mingw

  windows-msvc:
    # MSVC port - windows-latest already ships Visual Studio (MSVC/Windows
    # SDK/nmake) preinstalled, unlike windows-mingw's separate MSYS2
    # dependency; ilammy/msvc-dev-cmd sets up the same INCLUDE/LIB/PATH
    # environment `vcvarsall.bat`/an "x64 Native Tools Command Prompt"
    # would, for the ordinary pwsh steps below (no `shell:` override
    # needed, unlike windows-mingw's `msys2 {0}`).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc
      - name: Test
        run: ctest --preset windows-msvc
      - name: Install clang-cl
        run: choco install llvm -y --no-progress
      - name: Test (clang-cl as the generated-code backend, not just ebc's own build compiler)
        # Same two-independent-choices point as linux-clang's own second
        # Test step above: which compiler builds ebc itself (still real
        # cl.exe, via windows-msvc's own preset - unchanged) vs. which
        # compiler ebc invokes to compile *generated* C++ (-cxx/CXX).
        # clang-cl shares cl.exe's `/`-style flag syntax (isMsvcToolchain)
        # but deliberately never gets the MSVC PCH speedup (isClangCl,
        # main.cpp) - the two toolchains' PCH formats aren't
        # interchangeable, verified live rather than assumed.
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          $env:CXX = "clang-cl"
          ctest --preset windows-msvc

  # Haiku is not part of this matrix - no GitHub-hosted Haiku image exists.
  # The real path to Haiku CI is registering the SSH-reachable box as a
  # self-hosted runner once access is established (M8e) - see
  # docs/architecture/roadmap.md's M8e notes.
